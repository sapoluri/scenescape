networks:
  scenescape-test:

services:
  scene-metadata-db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: scenescape
      POSTGRES_PASSWORD: scenescape
      POSTGRES_DB: scene_metadata
    networks:
      - scenescape-test
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scenescape -d scene_metadata']
      interval: 5s
      timeout: 5s
      retries: 10
