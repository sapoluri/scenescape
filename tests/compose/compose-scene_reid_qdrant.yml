networks:
  scenescape-test:

secrets:
  root-cert:
    file: ${SECRETSDIR}/certs/scenescape-ca.pem
  django:
    file: ${SECRETSDIR}/django
  controller.auth:
    environment: CONTROLLER_AUTH

services:
  scene:
    image: intel/scenescape-controller
    init: true
    networks:
      scenescape-test:
    depends_on:
      web:
        condition: service_healthy
      broker:
        condition: service_started
      ntpserv:
        condition: service_started
      qdrant:
        condition: service_started
    environment:
      REID_DATABASE: QDRANT
      QDRANT_HOSTNAME: qdrant.scenescape.intel.com
      QDRANT_PORT: "6333"
      QDRANT_USE_TLS: "false"
    command: >
      --restauth /run/secrets/controller.auth
      --brokerauth /run/secrets/controller.auth
      --broker broker.scenescape.intel.com
      --ntp ntpserv
    volumes:
      - ./:/workspace
      - ./${DBROOT}/media:/workspace/media
      - ./controller/config/tracker-config.json:/home/scenescape/Scenescape/tracker-config.json
      - ${REID_CONFIG_FILE:-./controller/config/reid-config.json}:/home/scenescape/Scenescape/reid-config.json
    secrets:
      - source: root-cert
        target: certs/scenescape-ca.pem
      - django
      - controller.auth
    restart: on-failure
